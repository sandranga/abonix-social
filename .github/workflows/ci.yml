name: CI

# Tests on every push to main and on every pull request. No API keys needed:
# Claude, Pixabay, Telegram and Meta are faked in the tests. CI never deploys.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The pipeline tests render real images with Playwright.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q
