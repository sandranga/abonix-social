<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; font-weight: 400 800; src: url('{{ assets }}/fonts/inter-latin-ext.woff2') format('woff2-variations');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Inter'; font-weight: 400 800; src: url('{{ assets }}/fonts/inter-latin.woff2') format('woff2-variations');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* The Abonix palette, as in the app (frontend/src/theme.ts). Nothing else. */
:root {
  --indigo: #4f46e5; --indigo-dark: #4338ca; --indigo-light: #818cf8;
  --sky: #0ea5e9; --sky-dark: #0284c7; --sky-light: #38bdf8;
  --ink: #0f172a; --paper-dark: #1e293b; --slate: #475569; --mist: #f3f4f6; --white: #ffffff;
  --red: #dc2626; --green: #16a34a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; color: var(--ink);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

.canvas { position: relative; width: 1080px; height: 1350px; overflow: hidden; padding: 88px 84px 0; display: flex; flex-direction: column; }

/* Accent variants */
.accent-indigo   { background: radial-gradient(1200px 900px at 100% 0%, var(--indigo) 0%, var(--indigo) 40%, var(--indigo-dark) 100%); color: var(--white); }
.accent-sky      { background: radial-gradient(1100px 900px at 0% 0%, var(--sky-light) 0%, var(--sky) 40%, var(--sky-dark) 100%); color: var(--white); }
.accent-gradient { background: linear-gradient(135deg, var(--indigo) 0%, var(--sky) 100%); color: var(--white); }  /* the abonix.net hero */
.accent-dark     { background: radial-gradient(1100px 900px at 100% 0%, var(--paper-dark) 0%, var(--ink) 60%); color: var(--white); }
.accent-light  { background: var(--mist); color: var(--ink); }

/* Decorative shapes (pure CSS, no image model needed) */
.blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .16; background: #fff; pointer-events: none; }
.ring { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); pointer-events: none; }
.dots { position: absolute; width: 260px; height: 160px; opacity: .25; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.9) 2.5px, transparent 2.6px); background-size: 26px 26px; }

.kicker { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
  font-size: 26px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
  padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.16); }
.accent-light .kicker { background: rgba(79,70,229,.1); color: var(--indigo); }

h1 { font-size: 92px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; margin-top: 36px; }
h1.long { font-size: 78px; }
.sub { font-size: 38px; line-height: 1.3; font-weight: 500; margin-top: 26px; opacity: .92; max-width: 900px; }

.points { list-style: none; margin-top: 34px; display: flex; flex-direction: column; gap: 16px; }
.points li { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 600; }
.check { flex: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.2);
  display: grid; place-items: center; }
.check svg { width: 24px; height: 24px; }
.accent-light .check { background: var(--indigo); }

.footer { position: absolute; left: 84px; right: 84px; bottom: 56px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
.footer .logo { height: 58px; }
.footer .logo.white { filter: brightness(0) invert(1); }
.footer .url { font-size: 28px; font-weight: 700; letter-spacing: .01em; opacity: .9; }
.footer.on-photo { left: 0; right: 0; bottom: 0; padding: 40px 84px 56px; }
{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="canvas accent-{{ accent }} tpl-{{ template }}">
{% block body %}{% endblock %}
{% block footer %}
  <div class="footer">
    <img class="logo{{ '' if accent == 'light' else ' white' }}" src="{{ assets }}/brand/abonix-logo-transparent.png" alt="">
    <div class="url">abonix.net</div>
  </div>
{% endblock %}
</div>
</body>
</html>
