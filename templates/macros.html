{% macro check_icon(color='#ffffff') -%}
<svg viewBox="0 0 24 24" fill="none" stroke="{{ color }}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
{%- endmacro %}
{% macro cross_icon(color='#ffffff') -%}
<svg viewBox="0 0 24 24" fill="none" stroke="{{ color }}" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
{%- endmacro %}
{% macro points_list(points, color='#ffffff') -%}
{% if points %}<ul class="points">{% for p in points %}<li><span class="check">{{ check_icon(color) }}</span><span>{{ p }}</span></li>{% endfor %}</ul>{% endif %}
{%- endmacro %}
